[tools]
bun = "1.4.3"
node = "24.22.0"

[tasks.install]
description = "Install dependencies from bun.lock without resolving"
run = "bun install --frozen-lockfile"

[tasks."lint:ts"]
description = "Check TypeScript and JSON with Biome"
run = "bunx biome check ."

[tasks."lint:docs"]
description = "Check Markdown and YAML formatting with oxfmt"
run = "bunx oxfmt --check '**/*.md' '**/*.yml'"

[tasks.lint]
description = "Run every static check"
depends = ["lint:*"]

[tasks."fix:ts"]
description = "Apply Biome safe fixes and formatting"
run = "bunx biome check --write ."

[tasks."fix:docs"]
description = "Format Markdown and YAML with oxfmt"
run = "bunx oxfmt '**/*.md' '**/*.yml'"

[tasks.fix]
description = "Apply safe fixes and format every file"
depends = ["fix:*"]

[tasks.typecheck]
description = "Type-check with tsc"
run = "bunx tsc --noEmit"

[tasks.test]
description = "Run the unit tests; the integration tests are excluded"
run = "bun test --path-ignore-patterns tests/integration.test.ts"

[tasks."test:integration"]
description = "Run the tests that call Bing; needs BING_COOKIE"
run = "bun test tests/integration.test.ts"

[tasks."test:coverage"]
description = "Run every test with lcov coverage; integration tests need BING_COOKIE"
run = "bun test --coverage --coverage-reporter=lcov"

[tasks.build]
description = "Build dist/ with bunup"
run = "bunx bunup"

[tasks.check]
description = "Run lint, typecheck, test and build without writing tracked files"
depends = ["lint", "typecheck", "test", "build"]
