name: ci

on:
  push:
    branches:
      - "master"
  pull_request:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: "2.5.14"

      - run: bun install --frozen-lockfile

      - run: bun run check

      # Integration tests skip when BING_COOKIE is unset.
      - run: bun test

      - run: bun run build
