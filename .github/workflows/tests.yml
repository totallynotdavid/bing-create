name: tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'totallynotdavid' }}

    environment:
      name: testing

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5

      - run: bun run setup

      - run: bun run test:coverage
        env:
          BING_COOKIE: ${{ secrets.BING_COOKIE }}
        timeout-minutes: 5

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info

      - if: failure()
        run: |
          echo "::error::Tests failed. The Bing API may have changed or the cookie may have expired."
