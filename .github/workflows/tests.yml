name: tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'totallynotdavid' }}

    environment:
      name: testing

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - run: mise run install

      - run: mise run test:coverage
        env:
          BING_COOKIE: ${{ secrets.BING_COOKIE }}
        timeout-minutes: 5

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info

      - if: failure()
        run: |
          echo "::error::Tests failed. The Bing API may have changed or the cookie may have expired."
